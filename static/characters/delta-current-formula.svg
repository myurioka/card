<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 260" width="300" height="260" id="delta-current-formula">
  <!-- 背景 -->
  <rect width="300" height="260" rx="8" fill="#1e3a5f" fill-opacity="0.9"/>

  <!-- タイトル -->
  <text x="150" y="22" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#72F285" font-weight="bold">三相3線式 デルタ結線</text>
  <text x="150" y="38" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#72F285" font-weight="bold">電流 I の求め方</text>

  <!-- 上部区切り線 -->
  <line x1="20" y1="46" x2="280" y2="46" stroke="#4169e1" stroke-width="1.5"/>

  <!-- デルタ結線の特徴: VL = Vp -->
  <rect x="60" y="52" width="180" height="22" rx="4" fill="#293d29"/>
  <text x="150" y="67" text-anchor="middle" font-family="serif" font-size="13" fill="#72F285">特徴：VL = Vp（線間電圧 = 相電圧）</text>

  <!-- 区切り線 -->
  <line x1="20" y1="82" x2="280" y2="82" stroke="#293d29" stroke-width="1"/>

  <!-- メイン公式ラベル -->
  <text x="150" y="97" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#c8e6c8">── メイン公式（線電流）──</text>

  <!-- メイン公式: IL = √3 × VL / Z -->
  <text x="150" y="130" text-anchor="middle" font-family="serif" font-size="27" fill="#ffffff" font-weight="bold">IL = √3 × VL / Z</text>

  <!-- 分数表現補足 -->
  <text x="98"  y="155" text-anchor="middle" font-family="serif" font-size="16" fill="#c8e6c8">√3 × VL</text>
  <line x1="55" y1="158" x2="142" y2="158" stroke="#c8e6c8" stroke-width="1.2"/>
  <text x="98"  y="172" text-anchor="middle" font-family="serif" font-size="16" fill="#c8e6c8">Z</text>
  <text x="147" y="163" text-anchor="start"  font-family="serif" font-size="18" fill="#c8e6c8">= IL</text>

  <!-- 中央区切り線（破線） -->
  <line x1="30" y1="183" x2="270" y2="183" stroke="#395c39" stroke-width="1" stroke-dasharray="5,3"/>

  <!-- 補助公式ラベル -->
  <text x="150" y="196" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#c8e6c8">── 導出 ──</text>

  <!-- 補助公式 左: Ip = VL / Z -->
  <text x="75" y="215" text-anchor="middle" font-family="serif" font-size="15" fill="#c8e6c8">Ip = VL / Z</text>

  <!-- 補助公式 右: IL = √3 × Ip -->
  <text x="220" y="215" text-anchor="middle" font-family="serif" font-size="15" fill="#c8e6c8">IL = √3 × Ip</text>

  <!-- 下部区切り線 -->
  <line x1="20" y1="224" x2="280" y2="224" stroke="#4169e1" stroke-width="1"/>

  <!-- 記号説明 -->
  <text x="150" y="237" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#72F285">── 記号 ──</text>
  <text x="55"  y="252" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#ffffff">VL: 線間電圧[V]</text>
  <text x="150" y="252" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#ffffff">Ip: 相電流[A]</text>
  <text x="248" y="252" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#ffffff">Z: インピーダンス[Ω]</text>
</svg>
