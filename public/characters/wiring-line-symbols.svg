<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 230" width="300" height="230">
  <!-- 背景 -->
  <rect width="300" height="230" rx="8" fill="#1e3a5f" fill-opacity="0.85"/>
  <!-- 上部タイトル -->
  <text x="150" y="16" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#72F285" font-weight="bold">配線図の配線記号</text>
  <!-- 上部区切り線 -->
  <line x1="20" y1="22" x2="280" y2="22" stroke="#4169e1" stroke-width="1.5"/>

  <!-- 天井隠ぺい配線: 実線 -->
  <text x="25" y="57" text-anchor="start" font-family="sans-serif" font-size="15" fill="#ffffff">天井隠ぺい配線</text>
  <line x1="150" y1="52" x2="280" y2="52" stroke="#72F285" stroke-width="2.5"/>
  <text x="215" y="66" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#c8e6c8">実線</text>
  <line x1="20" y1="72" x2="280" y2="72" stroke="#395c39" stroke-width="1" stroke-dasharray="5,3"/>

  <!-- 床隠ぺい配線: 長い破線 -->
  <text x="25" y="97" text-anchor="start" font-family="sans-serif" font-size="15" fill="#ffffff">床隠ぺい配線</text>
  <line x1="150" y1="92" x2="280" y2="92" stroke="#72F285" stroke-width="2.5" stroke-dasharray="14,7"/>
  <text x="215" y="106" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#c8e6c8">破線（長い）</text>
  <line x1="20" y1="112" x2="280" y2="112" stroke="#395c39" stroke-width="1" stroke-dasharray="5,3"/>

  <!-- 露出配線: 短い破線 -->
  <text x="25" y="137" text-anchor="start" font-family="sans-serif" font-size="15" fill="#ffffff">露出配線</text>
  <line x1="150" y1="132" x2="280" y2="132" stroke="#72F285" stroke-width="2.5" stroke-dasharray="4,4"/>
  <text x="215" y="146" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#c8e6c8">破線（短い）</text>
  <line x1="20" y1="152" x2="280" y2="152" stroke="#395c39" stroke-width="1" stroke-dasharray="5,3"/>

  <!-- 地中配線: 一点鎖線 -->
  <text x="25" y="177" text-anchor="start" font-family="sans-serif" font-size="15" fill="#ffffff">地中配線</text>
  <line x1="150" y1="172" x2="280" y2="172" stroke="#72F285" stroke-width="2.5" stroke-dasharray="14,4,3,4"/>
  <text x="215" y="186" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#c8e6c8">一点鎖線</text>
  <line x1="20" y1="192" x2="280" y2="192" stroke="#4169e1" stroke-width="1"/>

  <!-- 補足 -->
  <text x="150" y="212" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#c8e6c8">線の種類で配線の施設場所を見分ける</text>
</svg>
