<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 230" width="300" height="230">
  <!-- 背景 -->
  <rect width="300" height="230" rx="8" fill="#1e3a5f" fill-opacity="0.85"/>
  <!-- 上部タイトル -->
  <text x="150" y="16" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#72F285" font-weight="bold">電線の抵抗率</text>
  <!-- 上部区切り線 -->
  <line x1="20" y1="22" x2="280" y2="22" stroke="#4169e1" stroke-width="1.5"/>

  <!-- 軟銅線: 1/58 -->
  <text x="25" y="63" text-anchor="start" font-family="sans-serif" font-size="15" fill="#ffffff">軟銅線</text>
  <text x="165" y="46" text-anchor="middle" font-family="serif" font-size="15" fill="#72F285" font-weight="bold">1</text>
  <line x1="147" y1="58" x2="183" y2="58" stroke="#72F285" stroke-width="1.5"/>
  <text x="165" y="76" text-anchor="middle" font-family="serif" font-size="15" fill="#72F285" font-weight="bold">58</text>
  <text x="192" y="63" text-anchor="start" font-family="sans-serif" font-size="10" fill="#ffffff">[Ω・mm²/m]</text>
  <line x1="20" y1="84" x2="280" y2="84" stroke="#395c39" stroke-width="1" stroke-dasharray="5,3"/>

  <!-- 硬銅線: 1/55 -->
  <text x="25" y="117" text-anchor="start" font-family="sans-serif" font-size="15" fill="#ffffff">硬銅線</text>
  <text x="165" y="100" text-anchor="middle" font-family="serif" font-size="15" fill="#72F285" font-weight="bold">1</text>
  <line x1="147" y1="112" x2="183" y2="112" stroke="#72F285" stroke-width="1.5"/>
  <text x="165" y="130" text-anchor="middle" font-family="serif" font-size="15" fill="#72F285" font-weight="bold">55</text>
  <text x="192" y="117" text-anchor="start" font-family="sans-serif" font-size="10" fill="#ffffff">[Ω・mm²/m]</text>
  <line x1="20" y1="138" x2="280" y2="138" stroke="#395c39" stroke-width="1" stroke-dasharray="5,3"/>

  <!-- アルミ線: 1/35 -->
  <text x="25" y="171" text-anchor="start" font-family="sans-serif" font-size="15" fill="#ffffff">アルミ線</text>
  <text x="165" y="154" text-anchor="middle" font-family="serif" font-size="15" fill="#72F285" font-weight="bold">1</text>
  <line x1="147" y1="166" x2="183" y2="166" stroke="#72F285" stroke-width="1.5"/>
  <text x="165" y="184" text-anchor="middle" font-family="serif" font-size="15" fill="#72F285" font-weight="bold">35</text>
  <text x="192" y="171" text-anchor="start" font-family="sans-serif" font-size="10" fill="#ffffff">[Ω・mm²/m]</text>
  <line x1="20" y1="192" x2="280" y2="192" stroke="#4169e1" stroke-width="1"/>

  <!-- 補足 -->
  <text x="150" y="208" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#c8e6c8">導電率が高い順：軟銅線 &gt; 硬銅線 &gt; アルミ線</text>
  <text x="150" y="222" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#ffffff">数値が小さいほど抵抗率が低い（導電率が高い）</text>
</svg>
