<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 230" width="300" height="230">
  <!-- 背景 -->
  <rect width="300" height="230" rx="8" fill="#1e3a5f" fill-opacity="0.85"/>
  <!-- 上部タイトル -->
  <text x="150" y="16" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#72F285" font-weight="bold">電線の表記</text>
  <!-- 上部区切り線 -->
  <line x1="20" y1="22" x2="280" y2="22" stroke="#4169e1" stroke-width="1.5"/>

  <!-- 表記 -->
  <text x="150" y="80" text-anchor="middle" font-family="serif" font-size="44" fill="#72F285" font-weight="bold">CVT</text>
  <!-- 電線名 -->
  <text x="150" y="108" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ffffff">架橋ポリエチレン絶縁ビニルシースケーブル</text>
  <text x="150" y="123" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#c8e6c8">(単心3本より線)</text>
  <line x1="20" y1="138" x2="280" y2="138" stroke="#4169e1" stroke-width="1"/>

  <!-- 表記の由来 -->
  <text x="150" y="160" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#c8e6c8">CV ＝ 架橋ポリエチレン絶縁ビニルシース</text>
  <text x="150" y="177" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#c8e6c8">T ＝ Triplex（単心3本より線）</text>
</svg>
