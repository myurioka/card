<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 230" width="300" height="230">
  <!-- 背景 -->
  <rect width="300" height="230" rx="8" fill="#1e3a5f" fill-opacity="0.85"/>
  <!-- 上部タイトル -->
  <text x="150" y="26" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#72F285" font-weight="bold">消費電力の公式</text>
  <!-- 上部区切り線 -->
  <line x1="20" y1="35" x2="280" y2="35" stroke="#4169e1" stroke-width="1.5"/>
  <!-- メイン公式: P = V × I -->
  <text x="150" y="88" text-anchor="middle" font-family="serif" font-size="40" fill="#ffffff" font-weight="bold">P = V × I</text>
  <!-- 中央区切り線（破線） -->
  <line x1="50" y1="100" x2="250" y2="100" stroke="#395c39" stroke-width="1" stroke-dasharray="5,3"/>
  <!-- 補助公式 左: P = I²R -->
  <text x="80" y="130" text-anchor="middle" font-family="serif" font-size="24" fill="#c8e6c8">P = I</text>
  <text x="113" y="120" text-anchor="start" font-family="serif" font-size="14" fill="#c8e6c8">2</text>
  <text x="122" y="130" text-anchor="start" font-family="serif" font-size="24" fill="#c8e6c8">R</text>
  <!-- 補助公式 右: P = V²/R -->
  <text x="185" y="130" text-anchor="middle" font-family="serif" font-size="24" fill="#c8e6c8">P = V</text>
  <text x="222" y="120" text-anchor="start" font-family="serif" font-size="14" fill="#c8e6c8">2</text>
  <text x="231" y="130" text-anchor="start" font-family="serif" font-size="24" fill="#c8e6c8">/R</text>
  <!-- 下部区切り線 -->
  <line x1="20" y1="145" x2="280" y2="145" stroke="#4169e1" stroke-width="1"/>
  <!-- 単位ラベル -->
  <text x="150" y="162" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#72F285">── 単位 ──</text>
  <!-- 単位一覧 -->
  <text x="55"  y="180" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ffffff">P : W (ワット)</text>
  <text x="200" y="180" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ffffff">V : V (ボルト)</text>
  <text x="55"  y="200" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ffffff">I : A (アンペア)</text>
  <text x="200" y="200" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ffffff">R : Ω (オーム)</text>
  <!-- 電力量 -->
  <line x1="20" y1="210" x2="280" y2="210" stroke="#293d29" stroke-width="1"/>
  <text x="150" y="225" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#c8e6c8">電力量 W = P × t  [単位: J (ジュール)]</text>
</svg>
