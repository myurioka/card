<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 230" width="300" height="230">
  <!-- 背景 -->
  <rect width="300" height="230" rx="8" fill="#1e3a5f" fill-opacity="0.85"/>
  <!-- 上部タイトル -->
  <text x="150" y="22" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#72F285" font-weight="bold">交流電圧の瞬時値の公式</text>
  <!-- 上部区切り線 -->
  <line x1="20" y1="30" x2="280" y2="30" stroke="#4169e1" stroke-width="1.5"/>
  <!-- メイン公式: v(t) = Vm sin(ωt) -->
  <text x="150" y="68" text-anchor="middle" font-family="serif" font-size="30" fill="#ffffff" font-weight="bold">v(t) = Vm sin(ωt)</text>
  <!-- 中央区切り線（破線） -->
  <line x1="50" y1="79" x2="250" y2="79" stroke="#395c39" stroke-width="1" stroke-dasharray="5,3"/>
  <!-- 補足: 意味 -->
  <text x="150" y="96" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#c8e6c8">（ある時刻 t における電圧の大きさ）</text>
  <!-- 下部区切り線 -->
  <line x1="20" y1="106" x2="280" y2="106" stroke="#4169e1" stroke-width="1"/>
  <!-- 記号ラベル -->
  <text x="150" y="122" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#72F285">── 記号の意味 ──</text>
  <!-- 記号一覧 -->
  <text x="150" y="141" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ffffff">v(t) : 時刻tでの電圧（瞬時値）</text>
  <text x="150" y="160" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ffffff">Vm : 電圧の最大値（振幅）</text>
  <text x="150" y="179" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ffffff">ω : 角周波数（角速度）</text>
  <!-- 補足: ωの定義 -->
  <line x1="20" y1="189" x2="280" y2="189" stroke="#293d29" stroke-width="1"/>
  <text x="150" y="207" text-anchor="middle" font-family="serif" font-size="14" fill="#72F285">ω = 2πf</text>
  <text x="150" y="222" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#c8e6c8">f : 周波数 [Hz]</text>
</svg>
