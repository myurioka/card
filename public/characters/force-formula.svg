<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 230" width="300" height="230">
  <!-- 背景 -->
  <rect width="300" height="230" rx="8" fill="#1e3a5f" fill-opacity="0.85"/>
  <!-- 上部タイトル -->
  <text x="150" y="26" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#72F285" font-weight="bold">導体にかかる電磁力の公式</text>
  <!-- 上部区切り線 -->
  <line x1="20" y1="35" x2="280" y2="35" stroke="#4169e1" stroke-width="1.5"/>
  <!-- メイン公式: F = BIL sinθ -->
  <text x="150" y="88" text-anchor="middle" font-family="serif" font-size="36" fill="#ffffff" font-weight="bold">F = BIL sinθ</text>
  <!-- 中央区切り線（破線） -->
  <line x1="50" y1="100" x2="250" y2="100" stroke="#395c39" stroke-width="1" stroke-dasharray="5,3"/>
  <!-- 補足: θは磁界と導体のなす角 -->
  <text x="150" y="128" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#c8e6c8">（θ：磁界と導体のなす角）</text>
  <!-- 向き: フレミング左手の法則 -->
  <text x="150" y="145" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#c8e6c8">向き：フレミングの左手の法則</text>
  <!-- 下部区切り線 -->
  <line x1="20" y1="155" x2="280" y2="155" stroke="#4169e1" stroke-width="1"/>
  <!-- 単位ラベル -->
  <text x="150" y="172" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#72F285">── 単位 ──</text>
  <!-- 単位一覧 -->
  <text x="55"  y="190" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ffffff">F : N (ニュートン)</text>
  <text x="200" y="190" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ffffff">B : T (テスラ)</text>
  <text x="55"  y="210" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ffffff">I : A (アンペア)</text>
  <text x="200" y="210" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ffffff">L : m (メートル)</text>
</svg>
