<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 230" width="300" height="230">
  <!-- 背景 -->
  <rect width="300" height="230" rx="8" fill="#1e3a5f" fill-opacity="0.85"/>
  <!-- 上部タイトル -->
  <text x="150" y="22" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#72F285" font-weight="bold">IV線（単線）の許容電流</text>
  <!-- 上部区切り線 -->
  <line x1="20" y1="30" x2="280" y2="30" stroke="#4169e1" stroke-width="1.5"/>

  <!-- 1.6mm: 27A -->
  <text x="150" y="58" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#ffffff">1.6mm ： <tspan fill="#72F285" font-weight="bold">27A</tspan></text>
  <text x="150" y="76" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#c8e6c8">語呂：いろ・27</text>
  <line x1="50" y1="88" x2="250" y2="88" stroke="#395c39" stroke-width="1" stroke-dasharray="5,3"/>

  <!-- 2.0mm: 35A -->
  <text x="150" y="110" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#ffffff">2.0mm ： <tspan fill="#72F285" font-weight="bold">35A</tspan></text>
  <text x="150" y="128" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#c8e6c8">1.6mmの27Aに「+8」、または語呂：にしち・35</text>
  <line x1="50" y1="140" x2="250" y2="140" stroke="#395c39" stroke-width="1" stroke-dasharray="5,3"/>

  <!-- 2.6mm: 48A -->
  <text x="150" y="162" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#ffffff">2.6mm ： <tspan fill="#72F285" font-weight="bold">48A</tspan></text>
  <text x="150" y="180" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#c8e6c8">一の位が「8」、語呂：にろく・48</text>

  <!-- 下部区切り線 -->
  <line x1="20" y1="192" x2="280" y2="192" stroke="#4169e1" stroke-width="1"/>
  <!-- 補足 -->
  <text x="150" y="212" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#ffffff">単位はA（アンペア）</text>
</svg>
