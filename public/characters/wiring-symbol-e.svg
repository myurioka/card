<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 230" width="300" height="230">
  <!-- 背景 -->
  <rect width="300" height="230" rx="8" fill="#1e3a5f" fill-opacity="0.85"/>
  <!-- 上部タイトル -->
  <text x="150" y="26" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#72F285" font-weight="bold">配線図の表記記号</text>
  <!-- 上部区切り線 -->
  <line x1="20" y1="35" x2="280" y2="35" stroke="#4169e1" stroke-width="1.5"/>
  <!-- 記号 E -->
  <text x="150" y="95" text-anchor="middle" font-family="serif" font-size="56" fill="#ffffff" font-weight="bold">E</text>
  <!-- 中央区切り線（破線） -->
  <line x1="50" y1="115" x2="250" y2="115" stroke="#395c39" stroke-width="1" stroke-dasharray="5,3"/>
  <!-- 答え -->
  <text x="150" y="145" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#72F285" font-weight="bold">ねじなし電線管</text>
  <!-- 下部区切り線 -->
  <line x1="20" y1="160" x2="280" y2="160" stroke="#4169e1" stroke-width="1"/>
  <!-- 補足 -->
  <text x="150" y="180" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ffffff">Electrical Metallic Tubing (EMT)</text>
  <text x="150" y="200" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#c8e6c8">薄鋼電線管をねじなしカップリング等で</text>
  <text x="150" y="216" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#c8e6c8">接続する金属製電線管</text>
</svg>
