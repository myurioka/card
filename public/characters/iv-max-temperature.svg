<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 230" width="300" height="230">
  <!-- 背景 -->
  <rect width="300" height="230" rx="8" fill="#1e3a5f" fill-opacity="0.85"/>
  <!-- 上部タイトル -->
  <text x="150" y="22" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#72F285" font-weight="bold">ビニル絶縁電線(IV)</text>
  <!-- 上部区切り線 -->
  <line x1="20" y1="30" x2="280" y2="30" stroke="#4169e1" stroke-width="1.5"/>
  <!-- 補足ラベル -->
  <text x="150" y="62" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#c8e6c8">絶縁物の最高許容温度</text>
  <!-- 中央区切り線（破線） -->
  <line x1="50" y1="76" x2="250" y2="76" stroke="#395c39" stroke-width="1" stroke-dasharray="5,3"/>
  <!-- メイン: 60℃ -->
  <text x="150" y="150" text-anchor="middle" font-family="serif" font-size="56" fill="#72F285" font-weight="bold">60℃</text>
  <!-- 下部区切り線 -->
  <line x1="20" y1="180" x2="280" y2="180" stroke="#4169e1" stroke-width="1"/>
  <!-- 補足 -->
  <text x="150" y="203" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#ffffff">IV : 600Vビニル絶縁電線の略号</text>
</svg>
