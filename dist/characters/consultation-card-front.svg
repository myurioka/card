<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 260" width="300" height="260">
  <!-- 背景 -->
  <rect width="300" height="260" rx="8" fill="#1a3a1a" fill-opacity="0.9"/>

  <!-- タイトルライン -->
  <line x1="20" y1="38" x2="280" y2="38" stroke="#4caf50" stroke-width="1.5"/>

  <!-- 日本語テキスト -->
  <text x="150" y="75" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#72F285" font-weight="bold">やぁ、ケン。</text>
  <text x="150" y="108" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#c8ffc8">ちょっと時間ある？</text>
  <text x="150" y="143" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#c8ffc8">相談に乗ってほしいんだ。</text>
  <text x="150" y="178" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#c8ffc8">この２つのデザインで</text>
  <text x="150" y="208" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#c8ffc8">迷っていて。</text>
  <text x="150" y="242" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#72F285" font-weight="bold">どっちが好き？</text>

  <!-- 下部区切り線 -->
  <line x1="20" y1="252" x2="280" y2="252" stroke="#4caf50" stroke-width="1"/>
</svg>
