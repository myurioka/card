<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 260" width="300" height="260">
  <!-- 背景 -->
  <rect width="300" height="260" rx="8" fill="#1e3a5f" fill-opacity="0.9"/>

  <!-- タイトルライン -->
  <line x1="20" y1="38" x2="280" y2="38" stroke="#4169e1" stroke-width="1.5"/>

  <!-- 英訳テキスト -->
  <text x="150" y="80" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#ffffff" font-weight="bold">Hey, Ken.</text>
  <text x="150" y="110" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#c8e6ff">Do you have a minute?</text>
  <text x="150" y="145" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#c8e6ff">I'd like to get your advice.</text>
  <text x="150" y="180" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#c8e6ff">I'm torn between</text>
  <text x="150" y="200" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#c8e6ff">these two designs.</text>
  <text x="150" y="235" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#72F285" font-weight="bold">Which do you like?</text>

  <!-- 下部区切り線 -->
  <line x1="20" y1="248" x2="280" y2="248" stroke="#4169e1" stroke-width="1"/>
</svg>
